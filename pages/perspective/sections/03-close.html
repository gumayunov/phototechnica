  <h2>Слишком близко: «рыбий глаз» и 0.5×</h2>
  <p>Самые сильные искажения получаются, когда камера почти упирается в лицо. Сверхширокий объектив вблизи делает ближнее огромным, а дальнее крошечным. Иногда это смешной приём, но для портрета обычно лучше отойти и взять объектив подлиннее.</p>
