<svg viewBox="0 0 820 300" role="img" aria-label="Сравнение динамического диапазона: сцена, глаз, камера, телефон, экран, печать">
      <g font-size="14">
        <!-- scale 0..20 stops, x from 200 to 780 => 29px per stop -->
        <g fill="var(--muted)" font-size="11" text-anchor="middle">
          <text x="200" y="22">0</text><text x="345" y="22">5</text><text x="490" y="22">10</text><text x="635" y="22">15</text><text x="780" y="22">20 ступеней</text>
        </g>
        <g stroke="var(--line)"><line x1="200" y1="30" x2="200" y2="270"/><line x1="345" y1="30" x2="345" y2="270"/><line x1="490" y1="30" x2="490" y2="270"/><line x1="635" y1="30" x2="635" y2="270"/><line x1="780" y1="30" x2="780" y2="270"/></g>
        <text x="0" y="57" fill="var(--ink)" font-weight="600">Солнечная сцена с тенью</text>
        <rect x="200" y="42" width="551" height="22" rx="4" fill="url(#drg)"/>
        <text x="0" y="97" fill="var(--ink)" font-weight="600">Глаз (привыкая)</text>
        <rect x="200" y="82" width="580" height="22" rx="4" fill="var(--dr)" opacity=".55"/>
        <text x="0" y="137" fill="var(--ink)" font-weight="600">Хорошая камера</text>
        <rect x="200" y="122" width="406" height="22" rx="4" fill="var(--dr)"/>
        <text x="0" y="177" fill="var(--ink)" font-weight="600">Телефон, один кадр</text>
        <rect x="200" y="162" width="319" height="22" rx="4" fill="var(--dr)" opacity=".8"/>
        <text x="0" y="217" fill="var(--ink)" font-weight="600">Экран, JPEG</text>
        <rect x="200" y="202" width="261" height="22" rx="4" fill="var(--dr)" opacity=".6"/>
        <text x="0" y="257" fill="var(--ink)" font-weight="600">Печать на бумаге</text>
        <rect x="200" y="242" width="188" height="22" rx="4" fill="var(--dr)" opacity=".45"/>
        <g font-size="12" fill="var(--ink)" font-weight="700">
          <text x="758" y="58">~19</text><text x="612" y="138">~14</text><text x="526" y="178">~11</text><text x="468" y="218">~9</text><text x="395" y="258">~6–7</text>
        </g>
      </g>
      <defs><linearGradient id="drg" x1="0" x2="1"><stop offset="0" stop-color="#000"/><stop offset="1" stop-color="#fff8dc"/></linearGradient></defs>
      <text x="410" y="292" text-anchor="middle" font-size="12.5" fill="var(--muted)">Числа примерные: важно соотношение. Сцена часто «шире», чем может записать камера, а экран — ещё уже.</text>
    </svg>
