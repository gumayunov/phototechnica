<svg viewBox="0 0 820 270" role="img" aria-label="Угол обзора при 16, 50 и 200 мм: вид сверху">
      <path d="M410,250 L237.2,122.1 A215,215 0 0,1 582.8,122.1 Z" fill="var(--fl)" fill-opacity="0.12" stroke="var(--fl)" stroke-width="2"/>
      <path d="M410,250 L324.3,52.8 A215,215 0 0,1 495.7,52.8 Z" fill="var(--fl)" fill-opacity="0.18" stroke="var(--fl)" stroke-width="2"/>
      <path d="M410,250 L387.5,36.2 A215,215 0 0,1 432.5,36.2 Z" fill="var(--fl)" fill-opacity="0.35" stroke="var(--fl)" stroke-width="2"/>
      <g transform="translate(410,250)"><rect x="-22" y="-6" width="44" height="22" rx="4" fill="var(--ink)"/><rect x="-9" y="-13" width="18" height="9" rx="2" fill="var(--ink)"/><circle cx="0" cy="5" r="6" fill="var(--paper)"/></g>
      <g font-size="14" font-weight="700" fill="var(--fl)">
        <text x="410" y="24" text-anchor="middle">200 мм · 12°</text>
        <text x="510" y="62">50 мм · 47° «как глаз»</text>
