      <g transform="translate(40,118)"><rect x="-6" y="-16" width="44" height="30" rx="5" fill="var(--ink)"/><rect x="38" y="-10" width="16" height="18" rx="2" fill="var(--ink)"/><circle cx="16" cy="-1" r="8" fill="var(--paper)"/></g>
